name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --all-targets --all-features

  rauc:
    name: Rauc
    runs-on: ubuntu-latest
    steps:
      - name: Check latest RAUC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=v1.10.1
          latest=$(gh api repos/rauc/rauc/releases/latest --jq .tag_name)
          
          interface=src/de.pengutronix.rauc.Installer.xml
          rauc=https://raw.githubusercontent.com/rauc/rauc
          
          curl -fsSL "$rauc/$pinned/$interface" -o pinned.xml
          curl -fsSL "$rauc/$latest/$interface" -o latest.xml

          if ! cmp --quite pinned.xml latest.xml; then
            echo "::error::The RAUC D-Bus interface changed between $pinned and $latest."
            exit 1
          fi

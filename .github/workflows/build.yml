name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets --all-features

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --all-targets --all-features

  rauc-interface:
    name: RAUC interface
    runs-on: ubuntu-latest
    steps:
      - name: Check latest RAUC release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned_tag=v1.10.1
          latest_tag=$(gh api repos/rauc/rauc/releases/latest --jq .tag_name)
          interface=src/de.pengutronix.rauc.Installer.xml

          curl -fsSL "https://raw.githubusercontent.com/rauc/rauc/$pinned_tag/$interface" -o pinned.xml
          curl -fsSL "https://raw.githubusercontent.com/rauc/rauc/$latest_tag/$interface" -o latest.xml

          if ! cmp -s pinned.xml latest.xml; then
            echo "::warning::The RAUC D-Bus interface changed between $pinned_tag and $latest_tag. Consider updating the Rust bindings."
          fi